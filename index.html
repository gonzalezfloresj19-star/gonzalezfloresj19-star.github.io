src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">

<style>

/* ========================================
   VARIABLES
======================================== */

:root {

  --oxxo-red: #E30613;

  --oxxo-dark-red: #C9000B;

  --oxxo-yellow: #FFD000;

  --white: #FFFFFF;

  --black: #111111;

  --gray: #737373;

  --soft-gray: #ECE9E5;

  --background: #F7F5F2;

  --shadow:
    0 18px 60px
    rgba(20, 20, 20, .14);

}


/* ========================================
   RESET
======================================== */

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color:
  transparent;

}


html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

}


body {

  min-height: 100dvh;

  overflow: hidden;

  background:

    radial-gradient(
      circle at 15% 0%,
      rgba(255,208,0,.12),
      transparent 32%
    ),

    radial-gradient(
      circle at 100% 100%,
      rgba(227,6,19,.08),
      transparent 35%
    ),

    var(--background);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

  color: var(--black);

}


/* ========================================
   APP
======================================== */

.app {

  width: 100%;

  max-width: 520px;

  height: 100dvh;

  margin: auto;

  display: grid;

  grid-template-rows:
    auto
    1fr
    auto;

  position: relative;

}


/* ========================================
   HEADER
======================================== */

.header {

  position: relative;

  z-index: 30;

  display: grid;

  grid-template-columns:
    1fr
    auto;

  align-items: center;

  padding:

    calc(
      12px +
      env(safe-area-inset-top)
    )

    17px

    10px;

}


/* LOGO */

.brand {

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  gap: 2px;

}


.brand-main {

  display: flex;

  align-items: center;

  font-weight: 950;

  font-size: 20px;

  letter-spacing: -1px;

  line-height: 1;

}


.oxxo-logo {

  position: relative;

  display: inline-flex;

  align-items: center;

  margin-left: 2px;

  padding: 3px 8px;

  color: white;

  background:
    var(--oxxo-red);

  border-radius: 4px;

  border-top:
    4px solid
    var(--oxxo-yellow);

  border-bottom:
    4px solid
    var(--oxxo-yellow);

  line-height: .9;

  box-shadow:
    0 3px 9px
    rgba(227,6,19,.15);

}


.brand-subtitle {

  margin-top: 3px;

  font-size: 9px;

  font-weight: 800;

  letter-spacing: 1.7px;

  text-transform: uppercase;

  color: #8A8580;

}


/* HEADER ACTIONS */

.header-actions {

  display: flex;

  align-items: center;

  gap: 9px;

}


.page-number {

  display: flex;

  align-items: center;

  justify-content: center;

  min-width: 54px;

  height: 34px;

  padding: 0 11px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.90);

  border:
    1px solid
    rgba(0,0,0,.06);

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.05);

  color: #666;

  font-size: 12px;

  font-weight: 800;

}


.icon-button {

  width: 34px;

  height: 34px;

  border: none;

  border-radius: 50%;

  background:
    rgba(255,255,255,.95);

  border:
    1px solid
    rgba(0,0,0,.06);

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.05);

  color: #333;

  display: grid;

  place-items: center;

  cursor: pointer;

  font-size: 16px;

}


/* ========================================
   MAIN AREA
======================================== */

.content {

  position: relative;

  min-height: 0;

  padding:

    4px

    11px

    7px;

}


/* ========================================
   PDF CARD
======================================== */

.viewer-shell {

  position: relative;

  width: 100%;

  height: 100%;

  overflow: hidden;

  border-radius: 26px;

  background: #FFFFFF;

  border:

    1px solid
    rgba(0,0,0,.07);

  box-shadow:
    var(--shadow);

}


/* RED ACCENT */

.viewer-shell::before {

  content: "";

  position: absolute;

  z-index: 4;

  left: 0;

  top: 0;

  right: 0;

  height: 4px;

  background:

    linear-gradient(
      90deg,
      var(--oxxo-red) 0 72%,
      var(--oxxo-yellow) 72% 100%
    );

}


/* ========================================
   PROGRESS BAR
======================================== */

.progress-area {

  position: absolute;

  z-index: 15;

  top: 12px;

  left: 18px;

  right: 18px;

  height: 3px;

  border-radius: 999px;

  overflow: hidden;

  background:
    rgba(0,0,0,.07);

}


.progress {

  height: 100%;

  width: 0;

  background:

    linear-gradient(
      90deg,
      var(--oxxo-red),
      #F23542
    );

  border-radius: inherit;

  transition:
    width .35s ease;

}


/* ========================================
   VISOR
======================================== */

.viewer {

  width: 100%;

  height: 100%;

  position: relative;

  overflow: hidden;

  background:

    linear-gradient(
      180deg,
      #FFFFFF,
      #FBFAF8
    );

  touch-action: pan-y;

  user-select: none;

  -webkit-user-select: none;

}


.track {

  display: flex;

  width: 100%;

  height: 100%;

  will-change: transform;

  transition:

    transform
    .42s
    cubic-bezier(
      .22,
      .72,
      .24,
      1
    );

}


.slide {

  min-width: 100%;

  width: 100%;

  height: 100%;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding:

    21px

    4px

    6px;

  position: relative;

}


canvas {

  display: block;

  max-width: 100%;

  max-height: 100%;

  border-radius: 4px;

}


/* ========================================
   LOADING
======================================== */

.loading {

  position: absolute;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 19px;

  background:
    #FFFFFF;

}


.loader-logo {

  font-size: 23px;

  font-weight: 950;

  letter-spacing: -.8px;

}


.loader-logo span {

  display: inline-block;

  padding: 3px 7px;

  margin-left: 2px;

  color: white;

  background:
    var(--oxxo-red);

  border-top:
    4px solid
    var(--oxxo-yellow);

  border-bottom:
    4px solid
    var(--oxxo-yellow);

  border-radius: 4px;

}


.loader-bar {

  width: 130px;

  height: 4px;

  overflow: hidden;

  border-radius: 999px;

  background:
    #ECECEC;

}


.loader-bar::after {

  content: "";

  display: block;

  width: 45%;

  height: 100%;

  border-radius: inherit;

  background:
    var(--oxxo-red);

  animation:
    loadingBar
    1.1s ease-in-out
    infinite;

}


@keyframes loadingBar {

  0% {

    transform:
      translateX(-110%);

  }

  100% {

    transform:
      translateX(290%);

  }

}


.loading small {

  color: #888;

  font-size: 11px;

  font-weight: 600;

}


/* ========================================
   SWIPE HINT
======================================== */

.swipe-hint {

  position: absolute;

  z-index: 25;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 8px;

  padding:

    9px

    14px;

  border-radius: 999px;

  background:
    rgba(17,17,17,.82);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  color: white;

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.18);

  font-size: 11px;

  font-weight: 700;

  white-space: nowrap;

  pointer-events: none;

  transition:
    opacity .35s ease,
    transform .35s ease;

}


.swipe-hint.hide {

  opacity: 0;

  transform:
    translate(-50%,8px);

}


/* ========================================
   TIKTOK CTA
======================================== */

.tiktok-cta {

  position: absolute;

  z-index: 40;

  left: 17px;

  right: 17px;

  bottom: 18px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(15px);

  transition:
    .35s ease;

}


.tiktok-cta.visible {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


.tiktok-cta a {

  min-height: 54px;

  padding:

    10px

    16px;

  display: grid;

  grid-template-columns:
    38px
    1fr
    24px;

  align-items: center;

  gap: 10px;

  text-decoration: none;

  color: white;

  background:
    rgba(15,15,15,.94);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

  border:

.tiktok-icon {

  height: 38px;

  display: grid;

  place-items: center;

  border-radius: 12px;

  background:

    linear-gradient(
      135deg,
      #25F4EE,

}


.tiktok-copy {

  display: flex;

  flex-direction: column;

  gap: 2px;

}


.tiktok-copy strong {

  font-size: 13px;

  font-weight: 850;

}


.tiktok-copy small {

  color:
    rgba(255,255,255,.68);

  font-size: 9px;

  font-weight: 600;

}


.tiktok-arrow {

  font-size: 21px;

  opacity: .7;

}


/* ========================================
   NAVIGATION
======================================== */

.navigation {

  display: grid;

  grid-template-columns:
    54px
    1fr
    54px;

  align-items: center;

  gap: 10px;

  padding:

    9px

    15px

    calc(
      10px +
      env(safe-area-inset-bottom)
    );

}


/* NAV BUTTON */

.nav-button {

  width: 50px;

  height: 50px;

  display: grid;

  place-items: center;

  border: none;

  border-radius: 17px;

  cursor: pointer;

  color: white;

  background:

    linear-gradient(

}


.nav-button:active {

    scale(.92);

}


.nav-button:disabled {

  box-shadow: none;

}


/* ========================================
   DOTS
======================================== */

.dots {

  min-width: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 7px;

}


.dot {

  width: 7px;

  height: 7px;

  padding: 0;

  border: none;

  border-radius: 50%;

  background:
    #CBC7C2;

  transition:
    all .3s ease;

}


.dot.active {

  width: 25px;

  border-radius: 999px;

  background:
    var(--oxxo-red);

/* ========================================
   FOOTNOTE
======================================== */

.age {

  position: absolute;

  z-index: 30;

  right: 20px;

  bottom: 9px;

  font-size: 8px;

  font-weight: 800;

  color:
    rgba(0,0,0,.30);

  pointer-events: none;

}


/* ========================================
   ERROR
======================================== */

.error {

  display: none;

  position: absolute;

  inset: 0;

  z-index: 150;

  background: white;

  align-items: center;

.error-box {

  max-width: 290px;

}


.error-icon {

  margin: auto auto 15px;

  width: 48px;

  height: 48px;

  place-items: center;

  border-radius: 15px;

  background:
    rgba(227,6,19,.09);

  color:
    var(--oxxo-red);

  font-size: 22px;

  font-weight: bold;

}


.error strong {

  display: block;

  font-size: 16px;

  margin-bottom: 8px;

}


.error p {

  margin: 0;

  color: #777;

  font-size: 12px;

}


/* ========================================
   DESKTOP
======================================== */

@media (
  min-width: 650px
) {

  body {

    padding:
      18px;

  }


  .app {

    height:
      calc(100dvh - 36px);

  }


  .viewer-shell {

    border-radius:
      30px;

  }

}


/* ========================================
   REDUCED MOTION
======================================== */

@media (
  prefers-reduced-motion:
  reduce
) {

  .track {

    transition:
      none;

  }

}

</style>

<script>


/* ========================================
   CONFIGURACIÓN
======================================== */


const PDF_URL =
  "./recetario.pdf";


pdfjsLib
.GlobalWorkerOptions
.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



/* ========================================
   ELEMENTOS
======================================== */


const track =
document.getElementById(
  "track"
);


const viewer =
document.getElementById(
  "viewer"
);


const counter =
document.getElementById(
  "counter"
);


const progress =
document.getElementById(
  "progress"
);


const loading =
document.getElementById(
  "loading"
);


const error =
document.getElementById(
  "error"
);


const prev =
document.getElementById(
  "prev"
);


const next =
document.getElementById(
  "next"
);


const dotsContainer =
document.getElementById(
  "dots"
);


const hint =
document.getElementById(
  "hint"
);


const tiktok =
document.getElementById(
  "tiktok"
);


const fullscreen =
document.getElementById(
  "fullscreen"
);



/* ========================================
   ESTADO
======================================== */


let pdf = null;

let currentPage = 0;

let totalPages = 0;

let slides = [];

let startX = 0;

let startY = 0;



/* ========================================
   CARGAR PDF
======================================== */


async function init() {


  try {


    pdf = await pdfjsLib

    .getDocument({
      url: PDF_URL
    })

    .promise;



    totalPages =
      pdf.numPages;



    createSlides();

    createDots();



    /*
      Renderizamos portada
      primero para cargar rápido.
    */


    await renderPage(0);


    loading.style.display =
      "none";


    updateUI();



    /*
      Precarga página 2.
    */


    if(
      totalPages > 1
    ) {

      renderPage(1);

    }



    setTimeout(
      () => {

        hint.classList.add(
          "hide"
        );

      },

      4500
    );


  }


  catch(err) {


    console.error(
      err
    );


    loading.style.display =
      "none";


    error.style.display =
      "flex";


  }


}



/* ========================================
   CREAR SLIDES
======================================== */


function createSlides() {


  track.innerHTML =
    "";


  slides =
    [];


  for(
    let i = 0;
    i < totalPages;
    i++
  ) {


    const slide =
      document.createElement(
        "article"
      );


    slide.className =
      "slide";


    const canvas =
      document.createElement(
        "canvas"
      );


    slide.appendChild(
      canvas
    );


    track.appendChild(
      slide
    );


    slides.push({

      canvas,

      rendered:
        false,

      rendering:
        false

    });


  }


}



/* ========================================
   RENDER PDF PAGE
======================================== */


async function renderPage(
  index,
  force = false
) {


  if(
    index < 0
    ||
    index >= totalPages
  ) {

    return;

  }


  const item =
    slides[index];


  if(
    item.rendering
  ) {

    return;

  }


  if(
    item.rendered
    &&
    !force
  ) {

    return;

  }


  item.rendering =
    true;


  try {


    const page =
      await pdf.getPage(
        index + 1
      );


    const base =
      page.getViewport({
        scale: 1
      });


    /*
      Un pequeño margen interno
      evita que el PDF toque
      directamente los bordes.
    */


    const availableWidth =
      viewer.clientWidth - 8;


    const availableHeight =
      viewer.clientHeight - 26;


    const fitScale =
      Math.min(

        availableWidth
        /
        base.width,

        availableHeight
        /
        base.height

      );


    /*
      Excelente calidad Retina,
      limitado a 2 para cuidar
      memoria del iPhone.
    */


    const pixelRatio =
      Math.min(

        window.devicePixelRatio
        ||
        1,

        2

      );


    const viewport =
      page.getViewport({

        scale:
          fitScale
          *
          pixelRatio

      });



    const canvas =
      item.canvas;


    canvas.width =
      Math.round(
        viewport.width
      );


    canvas.height =
      Math.round(
        viewport.height
      );


    canvas.style.width =

      `${

        viewport.width
        /
        pixelRatio

      }px`;


    canvas.style.height =

      `${

        viewport.height
        /
        pixelRatio

      }px`;



    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    context.fillStyle =
      "#FFFFFF";


    context.fillRect(

      0,

      0,

      canvas.width,

      canvas.height

    );



    await page.render({

      canvasContext:
        context,

      viewport:
        viewport

    }).promise;



    item.rendered =
      true;


  }


  catch(err) {


    console.error(

      `Error página ${
        index + 1
      }`,

      err

    );


  }


  finally {


    item.rendering =
      false;


  }


}



/* ========================================
   DOTS
======================================== */


function createDots() {


  dotsContainer.innerHTML =
    "";


  for(
    let i = 0;
    i < totalPages;
    i++
  ) {


    const dot =
      document.createElement(
        "button"
      );


    dot.className =
      "dot";


    dot.setAttribute(

      "aria-label",

      `Página ${i + 1}`

    );


    dot.addEventListener(

      "click",

      () => goTo(i)

    );


    dotsContainer
    .appendChild(
      dot
    );


  }


}



/* ========================================
   UPDATE UI
======================================== */


function updateUI() {


  track.style.transform =

    `translateX(-${
      currentPage * 100
    }%)`;



  counter.textContent =

    `${currentPage + 1} / ${totalPages}`;



  const percentage =

    (
      (
        currentPage + 1
      )
      /
      totalPages
    )
    *
    100;



  progress.style.width =

    `${percentage}%`;



  prev.disabled =

    currentPage === 0;



  next.disabled =

    currentPage ===
    totalPages - 1;



  document
  .querySelectorAll(
    ".dot"
  )
  .forEach(

    (dot,index) => {


      dot.classList.toggle(

        "active",

        index ===
        currentPage

      );


    }

  );



  /*
    CTA TikTok solo
    en última página.
  */


  tiktok.classList.toggle(

    "visible",

    currentPage ===
    totalPages - 1

  );



  if(
    currentPage > 0
  ) {


    hint.classList.add(
      "hide"
    );


  }


}



/* ========================================
   CHANGE PAGE
======================================== */


async function goTo(
  index
) {


  const newIndex =

    Math.max(

      0,

      Math.min(

        index,

        totalPages - 1

      )

    );


  if(
    newIndex ===
    currentPage
  ) {

    return;

  }


  currentPage =
    newIndex;


  updateUI();


  await renderPage(
    currentPage
  );


  /*
    Precarga página siguiente
  */


  renderPage(
    currentPage + 1
  );


  /*
    También precargamos
    la anterior.
  */


  renderPage(
    currentPage - 1
  );


}



/* ========================================
   BUTTONS
======================================== */


prev.addEventListener(

  "click",

  () => {

    goTo(
      currentPage - 1
    );

  }

);



next.addEventListener(

  "click",

  () => {

    goTo(
      currentPage + 1
    );

  }

);



/* ========================================
   SWIPE
======================================== */


viewer.addEventListener(

  "touchstart",

  event => {


    const touch =
      event.touches[0];


    startX =
      touch.clientX;


    startY =
      touch.clientY;


  },

  {
    passive: true
  }

);



viewer.addEventListener(

  "touchend",

  event => {


    const touch =
      event.changedTouches[0];


    const dx =

      touch.clientX
      -
      startX;


    const dy =

      touch.clientY
      -
      startY;



    /*
      Detectamos swipe
      horizontal real.
    */


    if(

      Math.abs(dx) > 45

      &&

      Math.abs(dx)
      >
      Math.abs(dy)
      *
      1.12

    ) {


      if(
        dx < 0
      ) {


        goTo(
          currentPage + 1
        );


      }


      else {


        goTo(
          currentPage - 1
        );


      }


    }


  },

  {
    passive: true
  }

);



/* ========================================
   KEYBOARD
======================================== */


document.addEventListener(

  "keydown",

  event => {


    if(
      event.key ===
      "ArrowRight"
    ) {


      goTo(
        currentPage + 1
      );


    }


    if(
      event.key ===
      "ArrowLeft"
    ) {


      goTo(
        currentPage - 1
      );


    }


  }

);



/* ========================================
   FULLSCREEN
======================================== */


fullscreen.addEventListener(

  "click",

  async () => {


    try {


      if(
        !document.fullscreenElement
      ) {


        await document
        .documentElement
        .requestFullscreen();


      }


      else {


        await document
        .exitFullscreen();


      }


    }


    catch(err) {


      /*
        Safari iPhone puede
        ignorar Fullscreen API.
        No afecta funcionamiento.
      */


      console.log(
        "Fullscreen no disponible"
      );


    }


  }

);



/* ========================================
   RESIZE / ORIENTATION
======================================== */


let resizeTimer;


window.addEventListener(

  "resize",

  () => {


    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(

        async () => {


          if(
            !pdf
          ) {

            return;

          }


          await renderPage(
            currentPage,
            true
          );


          renderPage(
            currentPage + 1,
            true
          );


        },

        300

      );


  }

);



/* ========================================
   START
======================================== */


window.addEventListener(

  "load",

  init

);


</script>
